name: Test

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
    
      - name: Set Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Update Schemas
        run: yarn fetch-schemas

      - name: Install dependencies
        run: rm -rf node_modules && yarn

      - name: Run unit tests
        run: yarn test